<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Бүртгэлийн хуудас</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="header">
      <h1 class="title">Бүртгэлийн хуудас</h1>
    </header>

    <nav class="navbar">
      <ul class="nav-list">
        <li><a href="../lab2/lab2.html">Нүүр</a></li>
        <li><a href="../lab2/lab2.html">Анкет засах</a></li>
        <li><a href="../lab2/lab2.html">Тусламж</a></li>
      </ul>
    </nav>

    <main class="main">
      <section class="form-container">
        <h2 class="form-title">Хувийн мэдээлэл</h2>

        <form action="submit_form.php" method="POST">
          <div class="form-group">
            <label for="name">Нэр:</label>
            <input
              class="form-input"
              type="text"
              id="name"
              name="name"
              required
              placeholder="Нэрээ оруулна уу"
            />
          </div>

          <div class="form-group">
            <label for="email">И-мэйл:</label>
            <input
              class="form-input"
              type="email"
              id="email"
              name="email"
              required
              placeholder="Майл хаягаа оруулна уу"
            />
          </div>

          <div class="form-group">
            <label for="password">Нууц үг:</label>
            <input
              class="form-input"
              type="password"
              id="password"
              name="password"
              required
              minlength="8"
              placeholder="Нууц үгээ оруулна уу"
            />
          </div>

          <div class="form-group">
            <label for="birthdate">Төрсөн огноо:</label>
            <input
              class="form-input"
              type="date"
              id="birthdate"
              name="birthdate"
              required
            />
          </div>

          <div class="form-group">
            <p>Хүйс:</p>

            <div class="option-group">
              <input type="radio" id="male" name="gender" value="male" />
              <label for="male">Эрэгтэй</label>

              <input type="radio" id="female" name="gender" value="female" />
              <label for="female">Эмэгтэй</label>
            </div>
          </div>

          <div class="form-group">
            <p>Сонирхол:</p>

            <div class="option-group">
              <input
                type="checkbox"
                name="interest"
                id="programming"
                value="programming"
              />
              <label for="programming">Програм хөгжүүлэлт</label>

              <input
                type="checkbox"
                name="interest"
                id="sports"
                value="sports"
              />
              <label for="sports">Спорт</label>

              <input type="checkbox" name="interest" id="music" value="music" />
              <label for="music">Хөгжим</label>
            </div>
          </div>

          <div class="form-group">
            <label for="country">Улс:</label>

            <select class="form-input" id="country" name="country" required>
              <option value="">-- Улсаа сонгоно уу --</option>
              <option value="mongolia">Монгол</option>
              <option value="korea">Өмнөд Солонгос</option>
              <option value="japan">Япон</option>
              <option value="usa">АНУ</option>
              <option value="other">Бусад</option>
            </select>
          </div>

          <div class="button-group">
            <button class="btn btn-primary" type="submit">Бүртгүүлэх</button>

            <button class="btn btn-secondary" type="reset">Цэвэрлэх</button>
          </div>
        </form>
      </section>
    </main>

    <footer class="footer">
      <p>&copy; 2026 Бүртгэлийн хуудас.</p>
    </footer>
  </body>
</html>
